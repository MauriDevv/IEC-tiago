apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-init
data: |
  CREATE USER IF NOT EXISTS 'root'@'%' IDENTIFIED BY 'root';
  GRANT ALL PRIVILEGES ON *.* TO 'root'@'%' WITH GRANT OPTION;

  CREATE USER IF NOT EXISTS 'fatec'@'%' IDENTIFIED BY 'senha@fatec';
  GRANT ALL PRIVILEGES ON db_bibliotea.* TO 'fatec'@'%';

  FLUSH PRIVILEGES;
---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          env: 
            - name: MYSQL_ROOT_PASSWORD
              value: "root"
            - name: MYSQL_DATABASE
              value: "db_biblioteca"
          ports:
            - containerPort: 3306
          volumeMounts:
            - name: mysql-storage
            