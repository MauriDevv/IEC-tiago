kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      # Porta do container Docker do Kind
      - containerPort: 30080
        hostPort: 30080
        protocol: TCP
      # Porta externa do Mysql
      - containerPort: 30306
      # Porta acessivel para o Mysql Workbanch
        hostPort: 30306
        protocol: TCP
       